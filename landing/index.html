<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>스터디 벅스 - 숙제, 매일 했는지 보이는 학습 관리</title>
<meta name="description" content="과외 숙제를 매일 했는지 그대로 남습니다. 밀린 분량은 남은 날짜에 자동으로 다시 나눠 담고, 못 한 날은 캘린더에 그대로 남습니다." />
<!-- og:image는 절대 URL이어야 하고 PNG여야 한다. 상대경로나 WebP로 두면 카카오톡을 비롯한
     대부분의 스크래퍼가 썸네일을 못 만든다. -->
<meta property="og:url" content="https://studybuks.store/" />
<meta property="og:title" content="스터디 벅스 - 숙제, 매일 했는지 보이는 학습 관리" />
<meta property="og:description" content="밀린 분량은 남은 날짜에 자동으로 다시 나눠 담습니다. 그런데 못 한 날은 캘린더에 그대로 남습니다." />
<meta property="og:image" content="https://studybuks.store/og-image.png" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="ko_KR" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="스터디 벅스 - 숙제, 매일 했는지 보이는 학습 관리" />
<meta name="twitter:description" content="밀린 분량은 남은 날짜에 자동으로 다시 나눠 담습니다. 그런데 못 한 날은 캘린더에 그대로 남습니다." />
<meta name="twitter:image" content="https://studybuks.store/og-image.png" />
<link rel="icon" href="/icons/icon-192.webp" type="image/webp" />
<link rel="apple-touch-icon" href="/icons/icon-192.webp" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<!-- Plus Jakarta Sans에는 한글 글리프가 없다. 이 페이지 텍스트는 거의 전부 한글이므로
     한글용 얼굴을 따로 얹지 않으면 전부 OS 기본 폰트로 떨어진다. -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
</head>

</body>
</html>
