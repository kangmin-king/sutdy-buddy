apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// 학생들에게 배포할 release APK 서명 정보. keystore.properties/*.jks는 git에 올리지 않는다
// (android/.gitignore) — 이 파일이 없으면(다른 컴퓨터 등) release 서명 없이 빌드만 되게 한다.
def keystorePropertiesFile = rootProject.file('app/keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.studybuddy.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.studybuddy.app"  
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 플레이는 같은 versionCode를 두 번 받지 않고, 안드로이드는 이 값이 커야 업데이트로
        // 인정한다. 1은 드라이브로 직접 배포한 APK가 이미 쓰고 있어서 2부터 시작한다 —
        // 그래야 그 APK를 쓰는 학생이 스토어 버전으로 넘어올 수 있다.
        // **스토어에 올릴 때마다 반드시 올릴 것.**
        versionCode 9
        // 사용자에게 보이는 버전. 1.1(학생 폰에 이미 깔려 있던 APK) 이후로 다크 모드,
        // 학생 탭 개편(플래너 → "나"), 매니저 화면 결함 수정, 회원 탈퇴 위치 변경이 들어갔다.
        // 1.2(versionCode 3)는 다크 대비 수정 전에 빌드해서 내 기기에만 설치됐다.
        // 1.2.1(versionCode 4)이 그 수정을 담았고, 1.2.2는 캘린더 범례·시험 표식까지 고쳤다.
        // 1.2.3(versionCode 6)은 매니저 정보구조 재편과 과외 날 표시 수정까지 담았다.
        // 1.2.2는 배포 직후 이 수정들이 나와서 학생에게 실제로 나간 적이 없다.
        // 1.2.4(versionCode 7)는 하루 경계를 자정에서 새벽 4시로 옮겼다 — 학생이 12시를
        // 넘겨 공부하면 그때까지 한 공부가 사라지던 문제.
        // 1.2.5(versionCode 8)는 Supabase 키를 legacy anon JWT에서 새 publishable 키로 갈았다.
        // **이 APK가 깔려야 legacy 키를 끌 수 있다** — 옛 APK에는 legacy anon 키가 구워져 있어서
        // legacy를 끄는 순간 서버에 못 붙는다. 노출된 service_role을 무효화하려면 꺼야 한다.
        // 1.2.6(versionCode 9)은 거기에 기기 최근접속 시각 기록을 더했다 — 이게 있어야
        // "학생이 새 APK를 깔았는지"를 sb_device_tokens.updated_at으로 확인할 수 있다.
        versionName "1.2.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

// capacitor.build.gradle(자동 생성, cap sync할 때마다 다시 만들어짐)이 compileOptions를
// VERSION_21로 강제하므로, Kotlin 컴파일 타겟도 여기 맞춘다 — 둘이 다르면 컴파일이 실패한다.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // 딴짓 멈춰: MainActivity에서 POST_NOTIFICATIONS 런타임 권한을 요청하기 위한 registerForActivityResult
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    implementation project(':capacitor-android')
    // 딴짓 멈춰: AccessibilityService/알림/리시버가 코루틴을 쓰기 위한 최소 의존성
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
