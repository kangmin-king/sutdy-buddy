apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// 학생들에게 배포할 release APK 서명 정보. keystore.properties/*.jks는 git에 올리지 않는다
// (android/.gitignore) — 이 파일이 없으면(다른 컴퓨터 등) release 서명 없이 빌드만 되게 한다.
def keystorePropertiesFile = rootProject.file('app/keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.studybuddy.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.studybuddy.app"  
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 플레이는 같은 versionCode를 두 번 받지 않고, 안드로이드는 이 값이 커야 업데이트로
        // 인정한다. 1은 드라이브로 직접 배포한 APK가 이미 쓰고 있어서 2부터 시작한다 —
        // 그래야 그 APK를 쓰는 학생이 스토어 버전으로 넘어올 수 있다.
        // **스토어에 올릴 때마다 반드시 올릴 것.**
        versionCode 12
        // 사용자에게 보이는 버전. 1.1(학생 폰에 이미 깔려 있던 APK) 이후로 다크 모드,
        // 학생 탭 개편(플래너 → "나"), 매니저 화면 결함 수정, 회원 탈퇴 위치 변경이 들어갔다.
        // 1.2(versionCode 3)는 다크 대비 수정 전에 빌드해서 내 기기에만 설치됐다.
        // 1.2.1(versionCode 4)이 그 수정을 담았고, 1.2.2는 캘린더 범례·시험 표식까지 고쳤다.
        // 1.2.3(versionCode 6)은 매니저 정보구조 재편과 과외 날 표시 수정까지 담았다.
        // 1.2.2는 배포 직후 이 수정들이 나와서 학생에게 실제로 나간 적이 없다.
        // 1.2.4(versionCode 7)는 하루 경계를 자정에서 새벽 4시로 옮겼다 — 학생이 12시를
        // 넘겨 공부하면 그때까지 한 공부가 사라지던 문제.
        // 1.2.5(versionCode 8)는 Supabase 키를 legacy anon JWT에서 새 publishable 키로 갈았다.
        // **이 APK가 깔려야 legacy 키를 끌 수 있다** — 옛 APK에는 legacy anon 키가 구워져 있어서
        // legacy를 끄는 순간 서버에 못 붙는다. 노출된 service_role을 무효화하려면 꺼야 한다.
        // 1.2.6(versionCode 9)은 거기에 기기 최근접속 시각 기록을 더했다 — 이게 있어야
        // "학생이 새 APK를 깔았는지"를 sb_device_tokens.updated_at으로 확인할 수 있다.
        // 1.2.7(versionCode 10)은 코덱스 전체 리뷰 결과를 담았다. 서버 쪽(푸시 스푸핑, 운영자
        // 삭제 대상 검증, 제안 컬럼 제한, 초대코드 강제)은 이미 배포돼서 옛 APK에도 적용되지만,
        // **클라이언트 수정은 이 APK가 있어야 적용된다**: 이월을 트랜잭션 RPC로 보내는 것,
        // 쓰기 실패 시 화면 되돌리기(낙관적 update 7곳 + 이월 + 숙제 범위 등록),
        // 초기 로드 실패를 온보딩과 구별하는 것, 모의고사 타이머 종료 사유, 타임라인의 허용앱 표시,
        // 스위치 키보드 조작, 알림 벨 제거, 온보딩 그라데이션 제거.
        // ⚠ **이월은 0027 마이그레이션이 먼저 들어가 있어야 동작한다**(2026-09-11 적용 완료).
        // 1.2.8(versionCode 11)은 푸시 알림의 문구와 수신자를 서버가 정하게 바꿨다. 그 전에는
        // 연결된 쌍 안에서 클라이언트가 문구를 만들어 보냈으므로 학생이 자기 선생님에게 가짜
        // "숙제를 완료했어요"를 보낼 수 있었다.
        // ⚠ **1.2.7 이하는 이 APK로 올라오기 전까지 푸시를 못 받는다** — 새 엣지 함수가 옛
        // 페이로드({userId,title,body})를 거부한다. 그 형태가 바로 구멍이라 열어둘 수 없었다.
        // **배포 시점(2026-09-11) 기준 사용자 4명 전원이 8월 빌드였다**(sb_device_tokens의
        // updated_at이 최초 등록 시각에 멈춰 있었다). 그래서 1.2.2~1.2.7은 아무도 설치하지
        // 않았고, 이 APK가 8월 이후 처음으로 실제 설치되는 버전이다.
        // 1.2.9(versionCode 12)는 마스코트를 앱 토큰에 맞는 저채도 토끼로 바꿨다(투명 배경,
        // 당근 대신 체크 카드). 1.2.8은 배포만 하고 **아무도 설치하기 전에** 1.2.9가 나왔으므로
        // 학생에게 요청할 설치는 여전히 한 번이다 — 1.2.8 대신 이걸 받으면 된다.
        versionName "1.2.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

// capacitor.build.gradle(자동 생성, cap sync할 때마다 다시 만들어짐)이 compileOptions를
// VERSION_21로 강제하므로, Kotlin 컴파일 타겟도 여기 맞춘다 — 둘이 다르면 컴파일이 실패한다.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // 딴짓 멈춰: MainActivity에서 POST_NOTIFICATIONS 런타임 권한을 요청하기 위한 registerForActivityResult
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    implementation project(':capacitor-android')
    // 딴짓 멈춰: AccessibilityService/알림/리시버가 코루틴을 쓰기 위한 최소 의존성
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
